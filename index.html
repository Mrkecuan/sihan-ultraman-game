<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>奥特曼英雄 · 思翰版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
      -webkit-touch-callout:none; touch-action:manipulation; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060f; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
      overscroll-behavior:none; -webkit-text-size-adjust:100%; position:fixed; }
  #app { position:fixed; inset:0; overflow:hidden; }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.active { display:flex; }

  /* ===== 宇宙背景 ===== */
  .cosmos { background: radial-gradient(ellipse at 30% 20%, #2a2a6e 0%, transparent 50%),
                        radial-gradient(ellipse at 75% 70%, #4a1a5e 0%, transparent 45%),
                        radial-gradient(ellipse at 50% 100%, #123, transparent 60%),
                        linear-gradient(180deg,#070a1e 0%,#0d1030 45%,#1a0f38 100%); }
  .stars { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .stars i { position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; opacity:.7; animation:tw 3s infinite; }
  @keyframes tw { 0%,100%{opacity:.15} 50%{opacity:.9} }

  /* ===== 顶栏 ===== */
  .topbar { display:flex; align-items:center; gap:8px; padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 6px; z-index:5; }
  .avatar { display:flex; align-items:center; gap:7px; background:rgba(10,20,60,.75); border:1px solid #3a5aff88; border-radius:24px; padding:4px 12px 4px 4px; }
  .avatar .face { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#e33,#fff 70%); border:2px solid #ffd54a; display:flex; align-items:center; justify-content:center; font-size:18px; }
  .avatar .info { line-height:1.15; }
  .avatar .name { color:#fff; font-size:12px; font-weight:700; }
  .avatar .lv { color:#7fd0ff; font-size:10px; }
  .res { margin-left:auto; display:flex; gap:6px; }
  .pill { display:flex; align-items:center; gap:4px; background:rgba(8,14,40,.8); border:1px solid #2c3f8f; border-radius:14px; padding:3px 10px 3px 6px; color:#ffe28a; font-size:12px; font-weight:700; }
  .pill.gem { color:#8ef0ff; }

  /* ===== 大厅 ===== */
  #heroStage { flex:1; position:relative; display:flex; align-items:center; justify-content:center; }
  #lobbyHeroCv { width:min(72vw,340px); height:min(60vh,430px); filter:drop-shadow(0 0 22px rgba(120,180,255,.35)); }
  .heroNameTag { position:absolute; left:50%; transform:translateX(-50%); bottom:8px; text-align:center; pointer-events:none; }
  .heroNameTag .n { color:#fff; font-size:17px; font-weight:800; text-shadow:0 0 10px #4af,0 2px 4px #000; letter-spacing:1px; }
  .heroNameTag .r { display:inline-block; margin-top:3px; font-size:10px; font-weight:800; padding:1px 10px; border-radius:8px; }
  .r.legend { background:linear-gradient(90deg,#a34,#f7b733); color:#fff; }
  .r.god { background:linear-gradient(90deg,#8af,#fff,#8af); color:#235; }
  .r.epic { background:linear-gradient(90deg,#63c,#a6f); color:#fff; }
  .power { position:absolute; left:12px; bottom:110px; color:#ffd54a; font-size:15px; font-weight:900; text-shadow:0 0 8px #a50,0 1px 3px #000; }
  .power small { color:#fff; font-weight:700; font-size:11px; }

  .bottombar { display:flex; gap:8px; padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 10px); z-index:5; }
  .menu-btn { flex:1; background:linear-gradient(180deg,#2b4bd8,#15267c); border:1px solid #6d8dff; border-radius:12px; color:#fff; padding:9px 0 7px; text-align:center; font-size:13px; font-weight:800; box-shadow:0 3px 8px rgba(0,0,30,.6), inset 0 1px 0 #ffffff40; }
  .menu-btn .ic { font-size:19px; display:block; margin-bottom:1px; }
  .menu-btn:active { transform:scale(.95); filter:brightness(1.2); }
  .menu-btn.gold { background:linear-gradient(180deg,#ffb62e,#e0700c); border-color:#ffe08a; }
  .menu-btn.gold .ic { animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }

  /* ===== 子页面通用 ===== */
  .page-head { display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px; }
  .back-btn { width:38px; height:38px; border-radius:50%; background:rgba(20,35,90,.9); border:1px solid #567; color:#fff; font-size:19px; display:flex; align-items:center; justify-content:center; }
  .back-btn:active { filter:brightness(1.4); }
  .page-title { color:#fff; font-size:18px; font-weight:900; letter-spacing:2px; text-shadow:0 0 12px #47f; }
  .scroll-area { flex:1; overflow-y:auto; padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 16px); -webkit-overflow-scrolling:touch; }

  /* 英雄卡 */
  .hero-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .hero-card { position:relative; border-radius:14px; padding:10px 8px 12px; text-align:center; border:2px solid #35509f; background:linear-gradient(180deg,#1a2260,#241245); overflow:hidden; }
  .hero-card.sel { border-color:#ffd54a; box-shadow:0 0 16px #fc3a; }
  .hero-card canvas { width:100%; height:150px; }
  .hero-card .hn { color:#fff; font-size:13px; font-weight:800; margin-top:2px; }
  .hero-card .ult { color:#9fd6ff; font-size:10px; margin-top:2px; }
  .hero-card .badge { position:absolute; top:6px; left:6px; font-size:10px; font-weight:900; padding:2px 8px; border-radius:8px; }
  .hero-card .stat { display:flex; justify-content:center; gap:8px; margin-top:4px; font-size:10px; color:#ffcf7a; }
  .cta { margin-top:7px; display:inline-block; min-width:86px; padding:6px 12px; border-radius:10px; font-size:12px; font-weight:900; color:#fff; }
  .cta.use { background:linear-gradient(180deg,#39d353,#177a2e); border:1px solid #9f9; }
  .cta.using { background:#333c55; border:1px solid #667; color:#9ab; }
  .cta.buy { background:linear-gradient(180deg,#ffb62e,#e0700c); border:1px solid #ffe08a; }
  .cta.lockg { background:linear-gradient(180deg,#3fd0ff,#1a6fd0); border:1px solid #bff; }
  .cta:active { transform:scale(.94); }

  /* 装备 */
  .eq-card { display:flex; align-items:center; gap:12px; background:linear-gradient(90deg,#182465,#22114a); border:1.5px solid #3a55b0; border-radius:14px; padding:12px; margin-bottom:12px; }
  .eq-ic { width:56px; height:56px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:30px; background:radial-gradient(circle at 35% 30%,#3c5cd8,#101c50); border:1px solid #6d8dff; }
  .eq-info { flex:1; }
  .eq-info .en { color:#fff; font-size:14px; font-weight:800; }
  .eq-info .ed { color:#8fb8ff; font-size:11px; margin-top:2px; }
  .eq-info .ev { color:#ffd54a; font-size:11px; font-weight:700; margin-top:3px; }
  .up-btn { min-width:82px; text-align:center; background:linear-gradient(180deg,#ffb62e,#e0700c); border:1px solid #ffe08a; border-radius:10px; color:#fff; font-weight:900; font-size:12px; padding:8px 6px; }
  .up-btn.max { background:#333c55; border-color:#667; color:#9ab; }
  .up-btn:active { transform:scale(.94); }

  /* 关卡 */
  .stage-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stage-card { position:relative; border-radius:14px; border:2px solid #35509f; background:linear-gradient(180deg,#14235e,#0d1030); padding:10px 8px 10px; text-align:center; }
  .stage-card.locked { filter:grayscale(.9) brightness(.55); }
  .stage-card .sn { color:#8fb8ff; font-size:11px; font-weight:700; line-height:1.3; }
  .stage-card .mn { color:#fff; font-size:15px; font-weight:900; margin:4px 0 2px; line-height:1.2; }
  .stage-card .ml { color:#ff9d6b; font-size:11px; font-weight:700; line-height:1.3; }
  .stage-card .diff { font-size:9px; margin-top:4px; letter-spacing:-1px; line-height:1.2; }
  .stage-card .stars { color:#ffd54a; font-size:13px; letter-spacing:1px; margin-top:5px; line-height:1.2; }
  .stage-card.bossgiant { border-color:#f0f; background:linear-gradient(180deg,#4a0a3a,#1a0520); box-shadow:0 0 14px #f0f5; }
  .stage-card .go { margin-top:8px; display:inline-block; padding:6px 22px; border-radius:10px; background:linear-gradient(180deg,#ffb62e,#e0700c); border:1px solid #ffe08a; color:#fff; font-weight:900; font-size:13px; }
  .stage-card .go:active { transform:scale(.94); }
  .stage-card.boss { border-color:#c33; background:linear-gradient(180deg,#3e1030,#160a20); }
  .lockmark { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:30px; }

  /* ===== 战斗 ===== */
  #battle { background:#000; }
  #battleCv { position:absolute; inset:0; width:100%; height:100%; }
  .hud { position:absolute; inset:0; pointer-events:none; z-index:3; }
  .hud-top { position:absolute; top:calc(env(safe-area-inset-top,0px) + 6px); left:8px; right:8px; display:flex; align-items:flex-start; gap:8px; }
  .php-wrap { display:flex; align-items:center; gap:6px; }
  .php-face { width:40px; height:40px; border-radius:50%; border:2px solid #ffd54a; background:linear-gradient(135deg,#e33,#eef); flex:none; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .bars { width:38vw; max-width:190px; }
  .php,.pen { height:10px; border-radius:6px; background:#111a; border:1px solid #000; overflow:hidden; margin-bottom:3px; }
  .php i,.pen i { display:block; height:100%; border-radius:5px; transition:width .15s; }
  .php i { width:100%; background:linear-gradient(90deg,#37e05a,#a8ff8a); }
  .pen i { width:0%; background:linear-gradient(90deg,#28c3ff,#bdf3ff); }
  .objective { margin:0 auto; background:rgba(0,10,30,.65); border:1px solid #4af7; color:#fff; font-size:12px; font-weight:700; padding:4px 14px; border-radius:14px; white-space:nowrap; }
  .kills { margin-left:auto; color:#fff; font-size:20px; font-weight:900; text-shadow:0 0 8px #4af; }
  .combo { position:absolute; right:14px; top:26%; color:#ff8c2e; font-size:22px; font-weight:900; text-shadow:0 0 10px #f50,0 2px 3px #000; opacity:0; transform:scale(.7); transition:all .12s; }
  .combo.show { opacity:1; transform:scale(1); }
  .bossbar { position:absolute; top:calc(env(safe-area-inset-top,0px) + 54px); left:50%; transform:translateX(-50%); width:66vw; max-width:330px; display:none; }
  .bossbar .bn { color:#ffb0b0; font-size:11px; font-weight:800; text-align:center; text-shadow:0 1px 2px #000; margin-bottom:2px; }
  .bossbar .bhp { height:9px; border-radius:5px; background:#100a; border:1px solid #500; overflow:hidden; }
  .bossbar .bhp i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#e02020,#ff9c40); }

  /* 摇杆 & 按钮 */
  .joy { position:absolute; left:22px; bottom:calc(env(safe-area-inset-bottom,0px) + 26px); width:118px; height:118px; border-radius:50%; background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.25); pointer-events:auto; z-index:4; }
  .joy .knob { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff8, #89a8ff55); border:2px solid #fff6; }
  .btns { position:absolute; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); width:190px; height:170px; pointer-events:none; z-index:4; }
  .abtn { position:absolute; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-weight:900; pointer-events:auto; border:2px solid #fff5; box-shadow:0 3px 10px #000a, inset 0 2px 3px #fff4; }
  .abtn:active { filter:brightness(1.35); transform:scale(.93); }
  .abtn .e { font-size:24px; line-height:1; } .abtn .t { font-size:10px; margin-top:1px; }
  #btnAtk { width:84px; height:84px; right:0; bottom:0; background:radial-gradient(circle at 35% 30%,#ff9d5c,#c22a0a); font-size:15px; }
  #btnSkill { width:62px; height:62px; right:96px; bottom:10px; background:radial-gradient(circle at 35% 30%,#6fc0ff,#0a4ac2); }
  #btnUlt { width:70px; height:70px; right:66px; bottom:92px; background:radial-gradient(circle at 35% 30%,#b58cff,#4a0ac2); }
  #btnUlt.ready { animation:ultglow 1s infinite; }
  @keyframes ultglow { 0%,100%{ box-shadow:0 0 8px #a6f;} 50%{ box-shadow:0 0 26px #c9f, 0 0 40px #86f;} }
  .cdmask { position:absolute; inset:0; border-radius:50%; background:rgba(0,0,20,.72); display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px; font-weight:900; }
  .abtn.dim { filter:grayscale(.6) brightness(.7); }
  .pausebtn { position:absolute; right:10px; top:calc(env(safe-area-inset-top,0px) + 52px); width:34px; height:34px; border-radius:50%; background:rgba(0,10,30,.6); border:1px solid #fff4; color:#fff; display:flex; align-items:center; justify-content:center; pointer-events:auto; z-index:4; font-size:14px; }

  /* 结算 */
  .overlay { position:absolute; inset:0; z-index:10; display:none; align-items:center; justify-content:center; background:rgba(2,4,16,.82); }
  .overlay.show { display:flex; }
  .result-box { width:min(82vw,330px); border-radius:18px; border:2px solid #5b7bff; background:linear-gradient(180deg,#18246e,#22114e); padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px)); text-align:center; box-shadow:0 0 40px #35f6; }
  .result-box h2 { font-size:26px; font-weight:900; letter-spacing:4px; margin-bottom:6px; }
  .result-box h2.win { color:#ffd54a; text-shadow:0 0 16px #fa0; }
  .result-box h2.lose { color:#8fa2c8; }
  .result-box .rstars { font-size:26px; color:#ffd54a; letter-spacing:6px; margin:4px 0 8px; }
  .result-box .reward { color:#fff; font-size:14px; margin:4px 0; font-weight:700; }
  .rbtns { display:flex; gap:10px; margin-top:14px; }
  .rbtn { flex:1; padding:11px 0; border-radius:12px; font-size:14px; font-weight:900; color:#fff; }
  .rbtn.main { background:linear-gradient(180deg,#ffb62e,#e0700c); border:1px solid #ffe08a; }
  .rbtn.sub { background:#2a3a70; border:1px solid #56c; }
  .rbtn:active { transform:scale(.95); }

  /* 提示 toast */
  #toast { position:fixed; left:50%; top:18%; transform:translateX(-50%); background:rgba(5,12,40,.92); border:1px solid #5b7bff; color:#fff; font-size:13px; font-weight:700; padding:9px 20px; border-radius:20px; z-index:99; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; }
  #toast.show { opacity:1; }

  /* ===== 横屏适配 ===== */
  #rotateTip { position:absolute; inset:0; z-index:20; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(3,6,20,.94); color:#fff; font-size:17px; font-weight:800; letter-spacing:2px; }
  #rotateTip .ph { font-size:56px; animation:rot 1.6s ease-in-out infinite; }
  @keyframes rot { 0%,20%{transform:rotate(0)} 55%,80%{transform:rotate(90deg)} 100%{transform:rotate(90deg)} }
  #rotateTip .sub { font-size:12px; color:#8fb8ff; font-weight:600; letter-spacing:1px; }
  @media (orientation: portrait) { #battle.active #rotateTip { display:flex; } }
  @media (orientation: landscape) {
    /* 大厅：横屏时压缩上下留白，按钮收窄居中 */
    .bottombar { max-width:520px; margin:0 auto; width:100%; }
    #lobbyHeroCv { width:min(36vw,260px); height:min(52vh,290px); }
    .power { bottom:56px; font-size:13px; }
    .heroNameTag .n { font-size:15px; }
    .topbar { padding-top:calc(env(safe-area-inset-top,0px) + 5px); }
    /* 列表页多列布局 */
    .hero-grid { grid-template-columns:repeat(4,1fr); }
    .hero-card canvas { height:120px; }
    .stage-grid { grid-template-columns:repeat(4,1fr); }
    .scroll-area { padding-left:max(12px, env(safe-area-inset-left,0px)); padding-right:max(12px, env(safe-area-inset-right,0px)); }
    .eq-card { max-width:560px; margin-left:auto; margin-right:auto; }
    /* 战斗：控件避开刘海圆角 */
    .joy { left:max(22px, env(safe-area-inset-left,0px)); }
    .btns { right:max(16px, env(safe-area-inset-right,0px)); }
    .hud-top { left:max(8px, env(safe-area-inset-left,0px)); right:max(8px, env(safe-area-inset-right,0px)); }
    .pausebtn { right:max(10px, env(safe-area-inset-right,0px)); }
  }
  /* 矮屏横屏(手机横放, 高度<420px): 进一步压缩, 保证按钮不被裁切 */
  @media (orientation: landscape) and (max-height: 430px) {
    #lobbyHeroCv { height:min(48vh, 240px) !important; }
    .topbar { padding-top:calc(env(safe-area-inset-top,0px) + 3px); padding-bottom:3px; }
    .avatar .face { width:28px; height:28px; font-size:15px; }
    .menu-btn { padding:6px 0 5px; font-size:12px; }
    .menu-btn .ic { font-size:16px; }
    .heroNameTag .n { font-size:13px; }
    .power { bottom:48px; font-size:12px; }
    .page-head { padding-top:calc(env(safe-area-inset-top,0px) + 5px); padding-bottom:5px; }
    .hero-card canvas { height:100px; }
  }

  /* 大招演出字幕 */
  #ultBanner { position:absolute; left:0; right:0; top:34%; text-align:center; z-index:6; pointer-events:none; opacity:0; }
  #ultBanner.show { animation:ub 1.6s ease forwards; }
  @keyframes ub { 0%{opacity:0; transform:scale(2.2);} 18%{opacity:1; transform:scale(1);} 80%{opacity:1;} 100%{opacity:0; transform:scale(.9);} }
  #ultBanner .big { font-size:34px; font-weight:900; letter-spacing:6px; color:#aef4ff; text-shadow:0 0 18px #0cf,0 0 40px #08f,0 3px 4px #000; }
</style>
</head>
<body>
<div id="app">

  <!-- ========== 大厅 ========== -->
  <div class="screen cosmos active" id="lobby">
    <div class="stars" id="stars1"></div>
    <div class="topbar">
      <div class="avatar">
        <div class="face">🦸</div>
        <div class="info"><div class="name">李思翰</div><div class="lv">Lv.<span id="pLv">1</span> 光之战士</div></div>
      </div>
      <div class="res">
        <div class="pill" id="btnSnd" style="cursor:pointer">🔊</div>
        <div class="pill">🪙 <span id="goldTxt">0</span></div>
        <div class="pill gem">💎 <span id="gemTxt">0</span></div>
      </div>
    </div>
    <div id="heroStage">
      <canvas id="lobbyHeroCv"></canvas>
      <div class="power">⚡ 战力 <span id="powerTxt">0</span></div>
      <div class="heroNameTag"><div class="n" id="lobbyHeroName"></div><div><span class="r legend" id="lobbyHeroR"></span></div></div>
    </div>
    <div class="bottombar">
      <div class="menu-btn" onclick="go('heroes')"><span class="ic">🦸</span>英雄</div>
      <div class="menu-btn" onclick="go('equip')"><span class="ic">🗡️</span>装备</div>
      <div class="menu-btn gold" onclick="go('stages')"><span class="ic">👾</span>挑战模式</div>
    </div>
  </div>

  <!-- ========== 英雄 ========== -->
  <div class="screen cosmos" id="heroes">
    <div class="page-head"><div class="back-btn" onclick="go('lobby')">◀</div><div class="page-title">英 雄</div>
      <div class="res" style="margin-left:auto"><div class="pill">🪙 <span class="goldSync"></span></div><div class="pill gem">💎 <span class="gemSync"></span></div></div>
    </div>
    <div class="scroll-area"><div class="hero-grid" id="heroGrid"></div></div>
  </div>

  <!-- ========== 装备 ========== -->
  <div class="screen cosmos" id="equip">
    <div class="page-head"><div class="back-btn" onclick="go('lobby')">◀</div><div class="page-title">装 备</div>
      <div class="res" style="margin-left:auto"><div class="pill">🪙 <span class="goldSync"></span></div></div>
    </div>
    <div class="scroll-area" id="equipList"></div>
  </div>

  <!-- ========== 关卡选择 ========== -->
  <div class="screen cosmos" id="stages">
    <div class="page-head"><div class="back-btn" onclick="go('lobby')">◀</div><div class="page-title">挑战模式</div>
      <div class="res" style="margin-left:auto"><div class="pill">⚡ <span id="powerTxt2"></span></div></div>
    </div>
    <div class="scroll-area"><div class="stage-grid" id="stageGrid"></div></div>
  </div>

  <!-- ========== 战斗 ========== -->
  <div class="screen" id="battle">
    <canvas id="battleCv"></canvas>
    <div class="hud">
      <div class="hud-top">
        <div class="php-wrap">
          <div class="php-face">🦸</div>
          <div class="bars">
            <div class="php"><i id="phpBar"></i></div>
            <div class="pen"><i id="penBar"></i></div>
          </div>

/* 根据设备能力自动分档，低端机降画质保帧率，高端机全开特效 */
const Q = (function () {
  // 内存/核心数做基础判断
  const mem = navigator.deviceMemory || navigator.hardwareConcurrency || 4;
  const cores = navigator.hardwareConcurrency || 4;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(navigator.userAgent);
  // 低端判定: 核心少 或 内存小
  let tier = "high";
  if (cores <= 4 || mem <= 2) tier = "mid";
  if (cores <= 2 || mem <= 1) tier = "low";
  const cfg = {
    high: { dprCap: 2,   glow: true,  particles: 22, bgDetail: true,  shadows: true,  maxDpr: 2 },
    mid:  { dprCap: 1.5, glow: true,  particles: 12, bgDetail: true,  shadows: false, maxDpr: 1.5 },
    low:  { dprCap: 1,   glow: false, particles: 6,  bgDetail: false, shadows: false, maxDpr: 1 }
  }[tier];
  const q = Object.assign({ tier, isIOS, isAndroid, fps: 60, _frames: 0, _t0: performance.now(), auto: true }, cfg);
  // 实时帧率监测：掉帧则自动降档
  q.sample = function (now) {
    q._frames++;
    const el = now - q._t0;
    if (el >= 2000) {
      q.fps = Math.round(q._frames * 1000 / el);
      q._frames = 0; q._t0 = now;
      if (q.auto) {
        // 连续低帧率 → 降档

        else if (q.fps < 28 && q.tier === "mid") { q.tier = "low"; q.dprCap = 1; q.particles = 6; q.glow = false; resizeCv(); }
      }
    }
  };
  return q;
})();

    if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }

  // 基础音: type/freq起止/时长/音量/滑音曲线
  tone(type, f0, f1, dur, vol, when = 0, curve = 1) {
    if (!this.on) return; const ac = this.ctx(); if (!ac) return;
    const t0 = ac.currentTime + when;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur * curve);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);

  noise(dur, vol, fLow = 400, fHigh = 4000, when = 0) {

    bp.frequency.setValueAtTime((fLow + fHigh) / 2, t0); bp.Q.value = 0.8;
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(ac.destination);

/* ---------- 画奥特曼 (分层皮套 · 立体金属拟真版) ---------- */
// 高=100u。脚 y=0, 胯 y=-34u, 肩 y=-70u, 头顶 y=-98u。人在画布内直接量取。
function drawUltra(ctx, hero, x, y, s, t, pose) {
  const c = hero.c; const u = s / 100;
  const style = hero.style || "orb";
  ctx.save(); ctx.translate(x, y);
  const bob = pose === "idle" ? Math.sin(t * 2.2) * 2 * u : 0;
  const runp = pose === "run" ? Math.sin(t * 14) : 0;
  ctx.translate(0, bob);
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  // 背光氛围(让金属皮肤有环境光)
  ctx.save();
  ctx.globalAlpha = 0.12 + Math.sin(t * 2) * 0.03;
  ctx.fillStyle = c.gem;
  ctx.beginPath(); ctx.ellipse(0, -55 * u, 34 * u, 46 * u, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  /* ---- 金属皮肤渐变 ---- */
  const body2 = c.body;
  function metal(len) { // len: 高
    const g = ctx.createLinearGradient(-9 * u, -len, 9 * u, 0);
    g.addColorStop(0, lighten(body2, 40));
    g.addColorStop(0.35, body2);
    g.addColorStop(0.7, shade2(body2, -18));
    g.addColorStop(1, shade2(body2, -36));
    return g;
  }

  /* ============ 腿(修长双侧) ============ */
  const legSw = 6.2 * u, legLen = 34 * u, hipY = -34 * u;
  const lp = runp * 6 * u;
  // 左腿
  ctx.strokeStyle = metal(legLen); ctx.lineWidth = legSw * 2;
  ctx.beginPath(); ctx.moveTo(-3.4 * u, hipY); ctx.lineTo(-4.6 * u + lp, -18 * u); ctx.lineTo(-5.6 * u + lp * 1.3, 0); ctx.stroke();
  // 右腿
  ctx.beginPath(); ctx.moveTo(3.4 * u, hipY); ctx.lineTo(4.6 * u - lp, -18 * u); ctx.lineTo(5.6 * u - lp * 1.3, 0); ctx.stroke();
  // 大腿色块(主色护甲)
  ctx.strokeStyle = c.main; ctx.lineWidth = legSw * 1.1;
  ctx.beginPath(); ctx.moveTo(-3.4 * u, hipY); ctx.lineTo(-4.6 * u + lp, -18 * u); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3.4 * u, hipY); ctx.lineTo(4.6 * u - lp, -18 * u); ctx.stroke();
  // 护膝高光
  ctx.fillStyle = lighten(body2, 30);
  ctx.beginPath(); ctx.arc(-5.0 * u + lp, -18 * u, 2.6 * u, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(5.0 * u - lp, -18 * u, 2.6 * u, 0, Math.PI * 2); ctx.fill();
  // 脚(战靴)
  ctx.strokeStyle = shade2(c.body, -30); ctx.lineWidth = 4 * u;
  ctx.beginPath(); ctx.moveTo(-5.6 * u + lp * 1.3, -1 * u); ctx.lineTo(-7 * u + lp * 1.3, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5.6 * u - lp * 1.3, -1 * u); ctx.lineTo(7 * u - lp * 1.3, 0); ctx.stroke();

  /* ============ 躯干(圆柱渐变+肌肉轮廓) ============ */
  const torsoTop = -70 * u, torsoBot = -34 * u;
  ctx.fillStyle = metal(torsoTop * -1);
  ctx.beginPath();
  ctx.moveTo(-11 * u, torsoTop);
  ctx.quadraticCurveTo(-13 * u, -57 * u, -9 * u, torsoBot);
  ctx.lineTo(9 * u, torsoBot);
  ctx.quadraticCurveTo(13 * u, -57 * u, 11 * u, torsoTop);
  ctx.closePath(); ctx.fill();
  // 胸肌轮廓(两块弧线阴影)
  ctx.strokeStyle = "rgba(0,0,30,.16)"; ctx.lineWidth = 1.6 * u;
  ctx.beginPath(); ctx.moveTo(-7 * u, -68 * u); ctx.quadraticCurveTo(-3.5 * u, -62 * u, 0, -63 * u); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7 * u, -68 * u); ctx.quadraticCurveTo(3.5 * u, -62 * u, 0, -63 * u); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -63 * u); ctx.lineTo(0, -50 * u); ctx.stroke();
  // 腹肌线
  ctx.strokeStyle = "rgba(0,0,30,.10)";
  for (const yy of [-58 * u, -52 * u]) {
    ctx.beginPath(); ctx.moveTo(-6 * u, yy); ctx.quadraticCurveTo(0, yy - 2.4 * u, 6 * u, yy); ctx.stroke();
  }

  /* ============ 每位奥特曼胸甲纹 ============ */
  if (style === "orb") {
    // 欧布红银斜纹大V + 银裆
    ctx.fillStyle = c.main;
    ctx.beginPath(); ctx.moveTo(-11 * u, -70 * u); ctx.lineTo(11 * u, -70 * u);
    ctx.lineTo(7 * u, -56 * u); ctx.lineTo(0, -47 * u); ctx.lineTo(-7 * u, -56 * u); ctx.closePath(); ctx.fill();
    ctx.fillStyle = lighten(c.main, 20);
    ctx.beginPath(); ctx.moveTo(-11 * u, -70 * u); ctx.lineTo(-11 * u, -63 * u); ctx.lineTo(-5 * u, -52 * u); ctx.lineTo(-7 * u, -56 * u); ctx.closePath(); ctx.fill();
    ctx.fillStyle = c.sub;
    ctx.beginPath(); ctx.moveTo(0, -47 * u); ctx.lineTo(7 * u, -56 * u); ctx.lineTo(8 * u, -34 * u); ctx.lineTo(-8 * u, -34 * u); ctx.lineTo(-7 * u, -56 * u); ctx.closePath(); ctx.fill();
  } else if (style === "tiga") {
    // 迪迦紫红复合大V
    ctx.fillStyle = c.main;
    ctx.beginPath(); ctx.moveTo(-11 * u, -70 * u); ctx.lineTo(11 * u, -70 * u); ctx.lineTo(8 * u, -55 * u);
    ctx.lineTo(0, 0 * 0); ctx.lineTo(0, -40 * u); ctx.lineTo(-8 * u, -55 * u); ctx.closePath();
    ctx.beginPath(); ctx.moveTo(0, -40 * u); ctx.lineTo(0, -34 * u); ctx.lineTo(-11 * u, -70 * u); ctx.closePath(); ctx.fill();

  const r = $("lobbyHeroR"); r.textContent = h.rarity; r.className = "r " + h.rc;

}
function lobbyLoop(ts) {
  if ($("lobby").classList.contains("active")) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = lobbyCv.clientWidth, hgt = lobbyCv.clientHeight;
    if (lobbyCv.width !== w * dpr) { lobbyCv.width = w * dpr; lobbyCv.height = hgt * dpr; }
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lctx.clearRect(0, 0, w, hgt);
    const t = ts / 1000;
    // 光环平台
    lctx.save();
    lctx.translate(w / 2, hgt * 0.88);
    lctx.fillStyle = "rgba(80,140,255,.18)";
    lctx.beginPath(); lctx.ellipse(0, 0, w * 0.34, 16, 0, 0, Math.PI * 2); lctx.fill();
    lctx.strokeStyle = "rgba(120,190,255,.5)"; lctx.lineWidth = 2;
    lctx.beginPath(); lctx.ellipse(0, 0, w * 0.34 + Math.sin(t * 2) * 5, 16, 0, 0, Math.PI * 2); lctx.stroke();
    lctx.restore();
    drawUltra(lctx, HEROES[S.hero], w / 2, hgt * 0.88, hgt * 0.8, t, "idle");
  }
  requestAnimationFrame(lobbyLoop);
}
requestAnimationFrame(lobbyLoop);

    else btn = `<span class="cta buy" data-act="buy" data-k="${key}">🪙${h.cost.gold} 解锁</span>`;
    card.innerHTML = `<span class="badge r ${h.rc}">${h.rarity}</span>

      <div class="stat"><span>⚔${h.atk}</span><span>❤${h.hp}</span></div>${btn}`;

  }

  grid.querySelectorAll("canvas").forEach(cv => {

    cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
    const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

/* =================================================================
   战斗系统
   ================================================================= */

const cv = $("battleCv"); const ctx = cv.getContext("2d", { alpha: false, desynchronized: true });
let B = null; // battle state
let joyVec = { x: 0, y: 0 };

function resizeCv() {
  const dpr = Math.min(Q.dprCap, window.devicePixelRatio || 1);
  cv.width = Math.floor(innerWidth * dpr); cv.height = Math.floor(innerHeight * dpr);
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 屏幕变了重新计算粒子预算
  Q.particles = Q.tier === "low" ? 6 : (Q.tier === "mid" ? 12 : 22);
}
addEventListener("resize", resizeCv);
// iOS 地址栏收缩/横竖屏切换
addEventListener("orientationchange", () => setTimeout(resizeCv, 350));
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => setTimeout(resizeCv, 120));
}

function startBattle(n) {
  requestLandscape();
  resizeCv();
  const st = STAGES[n - 1]; const hs = heroStats();
  const W = innerWidth, H = innerHeight;
  B = {
    n, st, t: 0, over: false, kills: 0,
    need: st.count + (st.boss ? 1 : 0),
    camX: 0, worldW: Math.max(W * 2.2, 1600),
    shake: 0, hitstop: 0,
    groundTop: H * 0.58, groundBot: H * 0.88,
    player: { x: W * 0.25, y: H * 0.74, hp: hs.hp, maxhp: hs.hp, atk: hs.atk, spd: hs.spd, crit: hs.crit,
              face: 1, pose: "idle", atkT: 0, hurtT: 0, en: 0, skillCd: 0, ultT: 0, invul: 0,
              transT: 0, giant: 1, giantMax: 1.8 },
    monsters: [], fx: [], projs: [], eprojs: [], texts: [],
    spawnLeft: st.count, spawnT: 0.5, bossSpawned: false, boss: null,
    combo: 0, comboT: 0, maxCombo: 0,
    result: null, lastTs: 0
  };
  // 预生成建筑背景
  B.bld = [];
  let bx = 0;
  while (bx < B.worldW + W) {
    const bw = 60 + Math.random() * 90, bh = H * (0.18 + Math.random() * 0.3);
    B.bld.push({ x: bx, w: bw, h: bh, c: 0.25 + Math.random() * 0.25, win: Math.random() });
    bx += bw + 15 + Math.random() * 40;
  }
  $("objTxt").textContent = `消灭 ${B.need} 只怪物`;
  $("killTxt").textContent = "0";
  $("bossbar").style.display = "none";
  $("resultOverlay").classList.remove("show");
  $("phpBar").style.width = "100%"; $("penBar").style.width = "0%";
  updateUltBtn();
  go("battle");
  // 开场变身巨大化
  B.player.transT = 1.3; B.player.giant = 1;
  SND.ultCharge();
  B.fx.push({ type: "flash", x: B.player.x, y: B.player.y - 90, t: 0, life: 0.6 });
  B.lastTs = performance.now();
  requestAnimationFrame(battleLoop);
}

function spawnMonster(kind, lv, isBoss, isGiant) {
  const H = innerHeight;
  const side = Math.random() < 0.6 ? 1 : -1;
  const px = B.player.x + side * (innerWidth * 0.55 + Math.random() * 200);
  const m = MONSTERS[kind];
  // 难度曲线: 血量/攻击随关卡显著提升
  const tier = 1 + (lv - 1) * 0.18;                 // 每关 +18%
  const hpBase = isBoss ? (380 + lv * 280) * tier * (isGiant ? 1.8 : 1)
                        : (85 + lv * 52) * tier * (isGiant ? 1.6 : 1);
  const mo = {
    kind, lv, boss: isBoss, giant: !!isGiant,
    x: Math.max(60, Math.min(B.worldW - 60, px)),
    y: B.groundTop + Math.random() * (B.groundBot - B.groundTop),
    hp: hpBase, maxhp: hpBase,
    atk: Math.round(((isBoss ? 30 : 13) + lv * 4.6) * (isGiant ? 1.35 : 1)),
    spd: (isBoss ? 0.5 : 0.68) + Math.random() * 0.22,
    // 体型显著加大
    size: (isBoss ? 210 : (isGiant ? 190 : 125)) * m.size,
    hurtT: 0, atkCd: 1 + Math.random(), dead: 0,
    // BOSS/巨型怪有额外技能
    skillCd: isBoss ? 3.5 : (isGiant ? 5 : 0),
    smashT: 0
  };
  B.monsters.push(mo);
  if (isBoss) {
    B.boss = mo; $("bossbar").style.display = "block";
    $("bossName").textContent = (isGiant ? "☠️ 巨型" : "👹 ") + m.name + "  Lv." + lv;
  }
}

/* ---------- 战斗主循环 ---------- */
function battleLoop(ts) {
  if (!B) return;
  let dt = Math.min(0.05, (ts - B.lastTs) / 1000); B.lastTs = ts;
  if (B.hitstop > 0) { B.hitstop -= dt; dt *= 0.15; }
  B.t += dt;
  Q.sample(ts);                     // 帧率监测 + 自动降档
  const W = innerWidth, H = innerHeight;
  const P = B.player;

  if (!B.over && !B.paused) {
    /* 刷怪 */
    B.spawnT -= dt;
    if (B.spawnT <= 0 && B.spawnLeft > 0 && B.monsters.filter(m => !m.dead).length < 4) {
      // 按关卡配置生成巨型怪(giant 表示本关巨型怪数量阈值)
      const isGiant = (B.st.giant || 0) > 0 && B.spawnLeft <= (B.st.giant || 0);
      spawnMonster(B.st.m, B.st.lv, false, isGiant); B.spawnLeft--;
      B.spawnT = 1.6;
    }
    if (!B.bossSpawned && B.st.boss && B.spawnLeft === 0 && B.monsters.filter(m => !m.dead && !m.boss).length <= 1) {
      B.bossSpawned = true; spawnMonster(B.st.boss, B.st.lv + 1, true, !!B.st.bossGiant);
      SND.bossWarn();
      toast(B.st.bossGiant ? "☠️ 巨型 BOSS 出现了！" : "⚠️ BOSS 出现了！"); B.shake = 0.5;
    }

    /* 玩家移动 */
    const mv = Math.hypot(joyVec.x, joyVec.y);
    if (mv > 0.15 && P.atkT <= 0 && P.ultT <= 0) {
      const sp = 240 * P.spd;
      P.x += joyVec.x * sp * dt; P.y += joyVec.y * sp * dt * 0.7;
      P.face = joyVec.x < -0.1 ? -1 : (joyVec.x > 0.1 ? 1 : P.face);
      P.pose = "run";
    } else if (P.atkT <= 0 && P.ultT <= 0) P.pose = "idle";
    P.x = Math.max(40, Math.min(B.worldW - 40, P.x));
    P.y = Math.max(B.groundTop, Math.min(B.groundBot, P.y));
    if (P.atkT > 0) { P.atkT -= dt; P.pose = "atk"; }
    if (P.ultT > 0) { P.ultT -= dt; P.pose = "ult"; }
    if (P.skillCd > 0) { P.skillCd -= dt; updateSkillCd(); }
    if (P.invul > 0) P.invul -= dt;
    if (P.hurtT > 0) P.hurtT -= dt;

    /* 相机 */
    const tgt = P.x - W * 0.45;
    B.camX += (Math.max(0, Math.min(B.worldW - W, tgt)) - B.camX) * Math.min(1, dt * 6);

    /* 变身巨大化 */
    if (P.transT > 0) {
      P.transT -= dt;
      const prog = 1 - Math.max(0, P.transT) / 1.1;      // 0→1
      P.giant = 1 + (P.giantMax - 1) * Math.min(1, prog * 1.35);
      P.invul = Math.max(P.invul, 0.15);                  // 变身过程无敌
      if (P.transT <= 0) { P.giant = P.giantMax; P.transT = 0; }
    }
    /* 怪物 AI */
    for (const m of B.monsters) {
      if (m.dead) { m.dead += dt; continue; }
      if (m.hurtT > 0) m.hurtT -= dt;
      const dx = P.x - m.x, dy = P.y - m.y, d = Math.hypot(dx, dy);
      const reach = m.boss ? 125 : (m.giant ? 110 : 82);
      // 远程攻击(巨型怪/BOSS): 保持距离时喷火球
      if (m.skillCd > 0) {
        m.skillCd -= dt;
        if (m.skillCd <= 0 && d > reach) {
          m.skillCd = m.boss ? 3.2 : 5.5;
          const spd = 300;
          B.eprojs.push({ x: m.x, y: m.y - m.size * 0.5, vx: (dx / d) * spd, vy: (dy / d) * spd * 0.4,
                          dmg: Math.round(m.atk * 1.3), r: m.boss ? 15 : 10, life: 3 });
          B.fx.push({ type: "flash", x: m.x, y: m.y - m.size * 0.5, t: 0, life: 0.2 });
        }
      }
      if (d > reach) {
        m.x += (dx / d) * m.spd * 95 * dt;
        m.y += (dy / d) * m.spd * 62 * dt;
        m.y = Math.max(B.groundTop, Math.min(B.groundBot, m.y));
      } else {
        m.atkCd -= dt;
        if (m.atkCd <= 0) {
          // 越高关卡攻击越频繁
          m.atkCd = (m.boss ? 1.15 : (m.giant ? 1.5 : 1.75)) - Math.min(0.5, m.lv * 0.04);
          if (P.invul <= 0) {
            P.hp -= m.atk; P.hurtT = 0.3; P.invul = 0.35;
            SND.hurt();
            B.shake = Math.max(B.shake, 0.22);
            addText(P.x, P.y - 130, "-" + m.atk, "#ff5c5c");
            $("phpBar").style.width = Math.max(0, P.hp / P.maxhp * 100) + "%";
            if (P.hp <= 0) return endBattle(false);
          }
        }
      }
    }

    /* 敌方火球 */
    for (const ep of B.eprojs) {
      ep.x += ep.vx * dt; ep.y += ep.vy * dt; ep.life -= dt;
      if (Math.hypot(ep.x - P.x, ep.y - (P.y - 70)) < 34 + ep.r && P.invul <= 0) {
        ep.life = 0;
        P.hp -= ep.dmg; P.hurtT = 0.3; P.invul = 0.4;
        SND.hurt(); B.shake = Math.max(B.shake, 0.26);
        addText(P.x, P.y - 130, "-" + ep.dmg, "#ff8c5c");
        $("phpBar").style.width = Math.max(0, P.hp / P.maxhp * 100) + "%";
        burst(ep.x, ep.y, 10);
        if (P.hp <= 0) return endBattle(false);
      }
    }
    B.eprojs = B.eprojs.filter(p => p.life > 0);

    /* 投射物(光线技能) */
    for (const pr of B.projs) {
      pr.x += pr.vx * dt; pr.life -= dt;
      for (const m of B.monsters) {
        if (m.dead || pr.hit.has(m)) continue;
        if (Math.abs(m.x - pr.x) < 60 && Math.abs(m.y - pr.y) < 80) {
          pr.hit.add(m); hitMonster(m, pr.dmg, false);
        }
      }
    }
    B.projs = B.projs.filter(p => p.life > 0);

    /* 龙卷风 */
    for (const f of B.fx) {
      if (f.type === "tornado") {
        f.x += f.vx * dt; f.t += dt;
        f.tick -= dt;
        if (f.tick <= 0) {
          f.tick = 0.18;
          for (const m of B.monsters) {
            if (m.dead) continue;
            if (Math.abs(m.x - f.x) < 150 && Math.abs(m.y - f.y) < 200) {
              hitMonster(m, f.dmg, true);
              m.x += f.vx * 0.06; // 吹飞
            }
          }
        }
      } else f.t += dt;
    }
    B.fx = B.fx.filter(f => f.t < f.life);

    /* 连击计时 */
    if (B.comboT > 0) { B.comboT -= dt; if (B.comboT <= 0) { B.combo = 0; $("comboTxt").classList.remove("show"); } }

    /* 清理死怪 */
    B.monsters = B.monsters.filter(m => m.dead < 0.6);
  }

  /* 漂浮文字 */
  for (const t of B.texts) { t.y -= 40 * dt; t.life -= dt; }
  B.texts = B.texts.filter(t => t.life > 0);
  if (B.shake > 0) B.shake -= dt;

  // 异常保护: 单帧渲染出错不中断游戏(移动端稳健性关键)
  try { render(W, H); }
  catch (e) {
    Q.errCount = (Q.errCount || 0) + 1;
    if (Q.errCount <= 3) console.warn("[render]", e && e.message);
  }
  requestAnimationFrame(battleLoop);
}

function hitMonster(m, dmg, isUlt) {
  const P = B.player;
  const crit = Math.random() < P.crit;
  const val = Math.round(dmg * (crit ? 1.8 : 1) * (0.9 + Math.random() * 0.2));
  m.hp -= val; m.hurtT = 0.25;
  if (crit) SND.crit(); else SND.punch();
  addText(m.x, m.y - m.size, (crit ? "暴击 " : "") + "-" + val, crit ? "#ffd54a" : "#fff", crit);
  B.combo++; B.comboT = 2; B.maxCombo = Math.max(B.maxCombo, B.combo);
  const ct = $("comboTxt"); ct.textContent = B.combo + " 连击"; ct.classList.add("show");
  if (!isUlt) {
    const wasFull = P.en >= 100;
    P.en = Math.min(100, P.en + 7); $("penBar").style.width = P.en + "%";
    if (!wasFull && P.en >= 100) SND.ready();
    updateUltBtn();
  }
  if (m.boss) $("bossHpBar").style.width = Math.max(0, m.hp / m.maxhp * 100) + "%";
  if (m.hp <= 0 && !m.dead) {
    m.dead = 0.001; B.kills++;
    if (m.boss) SND.bossdie(); else SND.mdie();
    SND.coin();
    $("killTxt").textContent = B.kills;
    addText(m.x, m.y - m.size - 30, "+" + (m.boss ? 80 : 15) + "🪙", "#ffe28a");
    burst(m.x, m.y - m.size * 0.5, m.boss ? 26 : 12);
    if (m.boss) { $("bossbar").style.display = "none"; B.shake = 0.6; B.hitstop = 0.25; }
    if (B.kills >= B.need) endBattle(true);
  }
}
function addText(x, y, txt, color, big) { B.texts.push({ x, y, txt, color, big, life: 0.9 }); }
function burst(x, y, n) {
  // 粒子数按画质档位缩放
  const real = Math.min(n, Q.particles);
  for (let i = 0; i < real; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 160;
    B.fx.push({ type: "spark", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: 0.5 + Math.random() * 0.3, c: Math.random() < 0.5 ? "#ffd54a" : "#8df" });
  }
}

/* ---------- 玩家操作 ---------- */
function doAttack() {
  const P = B && B.player; if (!P || B.over || P.atkT > 0 || P.ultT > 0) return;
  P.atkT = 0.28;
  // 命中判定：面前扇形(随巨大化扩大范围，战剑加持)
  let hitAny = false;
  const reachMul = P.giant * (1 + S.eq.weapon * 0.06);   // 越大 + 剑等级越高 → 打得更远
  const dmgMul = 1 + (P.giant - 1) * 0.9;                // 巨大化提升伤害
  for (const m of B.monsters) {
    if (m.dead) continue;
    const dx = m.x - P.x, dy = m.y - P.y;
    const rr = (m.boss ? 170 : 130) * reachMul;
    if (Math.abs(dy) < 90 * P.giant && dx * P.face > -30 && Math.abs(dx) < rr) {
      hitMonster(m, P.atk * dmgMul, false); hitAny = true;
    }

  if (hitAny) { B.hitstop = 0.05; B.shake = Math.max(B.shake, 0.08); }
  else SND.swing();
}
function doSkill() {

}

/* ---------- 渲染 ---------- */
function render(W, H) {
  const P = B.player; const t = B.t;
  let sx = 0, sy = 0;
  if (B.shake > 0) { sx = (Math.random() - 0.5) * B.shake * 22; sy = (Math.random() - 0.5) * B.shake * 16; }
  ctx.save(); ctx.translate(sx, sy);
  // 天空
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#8ec9ee"); sky.addColorStop(0.5, "#c9e6f5"); sky.addColorStop(0.62, "#7d8ba0"); sky.addColorStop(1, "#4a5568");
  ctx.fillStyle = sky; ctx.fillRect(-30, -30, W + 60, H + 60);
  // 云
  if (Q.bgDetail) {
    ctx.fillStyle = "rgba(255,255,255,.75)";
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 320 + t * 12 - B.camX * 0.2) % (W + 300)) - 150;
      const cy = H * (0.08 + (i % 3) * 0.07);
      ctx.beginPath(); ctx.ellipse(cx, cy, 70, 20, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 45, cy + 6, 45, 15, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  // 远景楼群(窗口图案只在画质允许时绘制，避免每帧数百次运算)
  const drawWin = Q.bgDetail;
  for (const b of B.bld) {
    const x = b.x - B.camX * 0.55;
    if (x + b.w < -50 || x > W + 50) continue;
    const gy = H * 0.6;
    ctx.fillStyle = `rgba(70,85,110,${b.c})`;
    ctx.fillRect(x, gy - b.h, b.w, b.h);
    if (drawWin) {
      ctx.fillStyle = "rgba(200,230,255,.25)";
      for (let wy = gy - b.h + 10; wy < gy - 12; wy += 26)
        for (let wx = x + 8; wx < x + b.w - 10; wx += 24)
          if ((wx * wy + b.win * 999) % 7 > 2.5) ctx.fillRect(wx, wy, 8, 10);
    }
  }
  // 地面(楼顶平台)
  const gt = B.groundTop - 60;
  const gg = ctx.createLinearGradient(0, gt, 0, H);
  gg.addColorStop(0, "#9aa3b2"); gg.addColorStop(0.15, "#7d8798"); gg.addColorStop(1, "#525c6e");
  ctx.fillStyle = gg; ctx.fillRect(-30, gt, W + 60, H - gt + 30);
  // 地面标线
  ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 3;
  for (let i = -1; i < 8; i++) {
    const lx = ((i * 260 - B.camX) % (W + 520) + W + 520) % (W + 520) - 260;
    ctx.beginPath(); ctx.moveTo(lx, gt + 30); ctx.lineTo(lx - 60, H); ctx.stroke();
  }
  ctx.strokeStyle = "rgba(255,210,80,.5)"; ctx.setLineDash([26, 18]);
  ctx.beginPath(); ctx.moveTo(-30, (B.groundTop + B.groundBot) / 2); ctx.lineTo(W + 30, (B.groundTop + B.groundBot) / 2); ctx.stroke();
  ctx.setLineDash([]);

  /* 世界坐标实体 —— 按 y 排序伪深度 */
  const ents = [];
  for (const m of B.monsters) ents.push({ y: m.y, kind: "m", o: m });
  ents.push({ y: P.y, kind: "p", o: P });
  ents.sort((a, b) => a.y - b.y);

  for (const e of ents) {
    if (e.kind === "m") {
      const m = e.o; const x = m.x - B.camX;
      if (x < -200 || x > W + 200) continue;
      const scale = 0.75 + (m.y - B.groundTop) / (B.groundBot - B.groundTop) * 0.45;
      // 影子
      ctx.fillStyle = "rgba(0,0,20,.28)";
      ctx.beginPath(); ctx.ellipse(x, m.y + 4, m.size * 0.42 * scale, 9 * scale, 0, 0, Math.PI * 2); ctx.fill();
      if (m.dead) ctx.globalAlpha = Math.max(0, 1 - m.dead / 0.6);
      drawMonster(ctx, m.kind, x, m.y, m.size * scale, t, m.hurtT, m.x > P.x);
      ctx.globalAlpha = 1;
      // 小血条
      if (!m.dead) {
        const bw = m.boss ? 90 : 54;
        ctx.fillStyle = "#0009"; ctx.fillRect(x - bw / 2, m.y - m.size * scale - 16, bw, 6);
        ctx.fillStyle = m.boss ? "#ff4040" : "#7CFC00";
        ctx.fillRect(x - bw / 2 + 1, m.y - m.size * scale - 15, (bw - 2) * Math.max(0, m.hp / m.maxhp), 4);
        ctx.fillStyle = "#fff"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("Lv." + m.lv, x, m.y - m.size * scale - 20);
      }
    } else {
      const x = P.x - B.camX;
      const scale = (0.8 + (P.y - B.groundTop) / (B.groundBot - B.groundTop) * 0.4) * P.giant;
      ctx.fillStyle = "rgba(0,0,20,.3)";
      ctx.beginPath(); ctx.ellipse(x, P.y + 4, 34 * scale, 8 * scale, 0, 0, Math.PI * 2); ctx.fill();
      if (P.invul > 0 && Math.floor(t * 20) % 2) ctx.globalAlpha = 0.5;
      // 变身光环
      if (P.transT > 0) {
        ctx.globalAlpha = 0.75;
        ctx.strokeStyle = "#8ef"; ctx.lineWidth = 5 * P.giant;
        ctx.shadowColor = "#4cf"; ctx.shadowBlur = glowOn() ? 26 : 0;
        ctx.beginPath(); ctx.ellipse(x, P.y, 60 * P.giant, 16 * P.giant, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(x, P.y - 120 * P.giant, 60 * P.giant, 0, Math.PI * 2); ctx.stroke();
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      }
      ctx.save(); ctx.translate(x, 0); ctx.scale(P.face, 1); ctx.translate(-x, 0);
      drawUltra(ctx, HEROES[S.hero], x, P.y, 150 * scale, t, P.pose);
      ctx.restore();
      ctx.globalAlpha = 1;
      // 巨大化标识
      if (P.giant > 1.35) {
        ctx.fillStyle = "#7cf5ff"; ctx.font = "900 12px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("★ 巨大化 ★", x, P.y - 175 * P.giant);
      }
    }
  }

  /* 敌方火球 */
  for (const ep of B.eprojs) {
    const x = ep.x - B.camX;
    const rg = ctx.createRadialGradient(x, ep.y, 1, x, ep.y, ep.r * 1.8);
    rg.addColorStop(0, "#fff"); rg.addColorStop(0.35, "#ffb040"); rg.addColorStop(1, "rgba(255,60,0,0)");
    ctx.fillStyle = rg; ctx.shadowColor = "#f60"; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(x, ep.y, ep.r * 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  /* 投射物 */
  for (const pr of B.projs) {
    const x = pr.x - B.camX;
    const g = ctx.createLinearGradient(x - 50, 0, x + 50, 0);
    g.addColorStop(0, "rgba(120,220,255,0)"); g.addColorStop(0.5, "#dff6ff"); g.addColorStop(1, "rgba(120,220,255,0)");
    ctx.fillStyle = g; ctx.shadowColor = "#4cf"; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.ellipse(x, pr.y, 55, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  /* 特效 */
  for (const f of B.fx) {
    const x = f.x - B.camX;
    if (f.type === "spark") {
      f.x += f.vx * 0.016; f.y += f.vy * 0.016; f.vy += 3;
      ctx.fillStyle = f.c; ctx.globalAlpha = 1 - f.t / f.life;
      ctx.fillRect(x - 2, f.y - 2, 4, 4); ctx.globalAlpha = 1;
    } else if (f.type === "tornado") {
      drawTornado(ctx, x, f.y, f.t);
    } else if (f.type === "flash" || f.type === "bigflash") {
      // 夹紧到 [0,1] 避免负半径(部分安卓/严格模式浏览器会抛异常导致画面卡死)
      const k = Math.max(0, Math.min(1, 1 - f.t / f.life));
      const r = Math.max(0.1, (f.type === "bigflash" ? 90 : 40) * k);
      ctx.fillStyle = "rgba(200,240,255," + (0.8 * k) + ")";
      ctx.beginPath(); ctx.arc(x, f.y, r, 0, Math.PI * 2); ctx.fill();
    } else if (f.type === "ring") {
      const pr = Math.max(0, Math.min(1, f.t / f.life));
      ctx.strokeStyle = "rgba(120,255,220," + (1 - pr) + ")"; ctx.lineWidth = 8 * (1 - pr) + 2;
      ctx.beginPath(); ctx.arc(x, f.y, Math.max(0.1, pr * innerWidth * 0.65), 0, Math.PI * 2); ctx.stroke();
    } else if (f.type === "bolt") {
      ctx.strokeStyle = "rgba(255,245,150," + (1 - f.t / f.life) + ")"; ctx.lineWidth = 5;
      ctx.beginPath(); let by = -20;
      ctx.moveTo(x + 10, by);
      while (by < f.y) { by += 30; ctx.lineTo(x + (Math.random() - 0.5) * 30, by); }
      ctx.stroke();
    }
  }

  /* 漂浮文字 */
  ctx.textAlign = "center";
  for (const tx of B.texts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, tx.life * 2));
    ctx.font = (tx.big ? "900 22px" : "800 16px") + " sans-serif";
    ctx.fillStyle = tx.color; ctx.strokeStyle = "#0008"; ctx.lineWidth = 3;
    ctx.strokeText(tx.txt, tx.x - B.camX, tx.y);
    ctx.fillText(tx.txt, tx.x - B.camX, tx.y);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* 超级龙卷风绘制 */
function drawTornado(ctx, x, y, t) {
  ctx.save(); ctx.translate(x, y);
  const H = 320, layers = 12;
  for (let i = 0; i < layers; i++) {
    const p = i / layers;
    const w = 30 + p * 130;
    const yy = -p * H;
    const wob = Math.sin(t * 10 + i * 1.1) * 14;
    ctx.strokeStyle = `rgba(${140 + p * 80},${220},${255},${0.75 - p * 0.35})`;
    ctx.lineWidth = 7 - p * 3;
    ctx.beginPath();
    ctx.ellipse(wob * 0.5, yy, w, 14 + p * 8, 0, t * 8 + i, t * 8 + i + Math.PI * 1.5);
    ctx.stroke();
  }
  // 中心光柱
  const g = ctx.createLinearGradient(0, 0, 0, -H);
  g.addColorStop(0, "rgba(160,230,255,.35)"); g.addColorStop(1, "rgba(200,245,255,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(-90, -H); ctx.lineTo(90, -H); ctx.lineTo(26, 0); ctx.closePath(); ctx.fill();
  // 卷起的碎片
  for (let i = 0; i < 8; i++) {
    const a = t * 12 + i * 0.8;
    const p = (i / 8 + t * 0.6) % 1;
    ctx.fillStyle = "rgba(230,250,255," + (0.9 - p * 0.7) + ")";
    ctx.beginPath();
    ctx.arc(Math.cos(a) * (30 + p * 110), -p * H, 4 + p * 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

/* ---------- 结算 ---------- */
function endBattle(win) {
  if (B.over) return; B.over = true;
  if (win) SND.win(); else SND.lose();
  const P = B.player;
  const n = B.n;
  let stars = 0, gold = 0, gems = 0;
  if (win) {
    const hpPct = P.hp / P.maxhp;
    stars = hpPct > 0.7 ? 3 : hpPct > 0.35 ? 2 : 1;
    gold = 120 + n * 60 + B.maxCombo * 2;
    const firstClear = !(S.stars[n] > 0);
    gems = firstClear ? 10 + n * 2 : 2;
    S.gold += gold; S.gems += gems;
    S.stars[n] = Math.max(S.stars[n] || 0, stars);
    if (n === S.maxStage && n < STAGES.length) S.maxStage = n + 1;
    save();
  }
  setTimeout(() => {
    $("resultTitle").textContent = win ? "胜 利" : "失 败";
    $("resultTitle").className = win ? "win" : "lose";
    $("resultStars").textContent = win ? "★".repeat(stars) + "☆".repeat(3 - stars) : "";
    $("resultReward").innerHTML = win
      ? `🪙 +${gold} &nbsp; 💎 +${gems}<br><span style="font-size:12px;color:#9fd6ff">最高连击 ${B.maxCombo} · 消灭 ${B.kills} 只怪兽</span>`
      : `<span style="font-size:13px;color:#9fd6ff">升级装备、换英雄再来挑战吧！</span>`;
    const nx = $("btnNext");
    if (win && B.n < STAGES.length) { nx.style.display = "block"; nx.textContent = "下一关"; nx.onclick = () => startBattle(B.n + 1); }
    else if (!win) { nx.style.display = "block"; nx.textContent = "再来一次"; nx.onclick = () => startBattle(B.n); }
    else { nx.style.display = "block"; nx.textContent = "🎉 通关啦"; nx.onclick = () => quitBattle(); }
    $("resultOverlay").classList.add("show");
    syncRes();
  }, win ? 700 : 400);
}
function quitBattle() { B = null; exitLandscape(); go('stages'); }

/* ---------- 横屏 & 全屏 ---------- */
function requestLandscape() {
  const el = document.documentElement;
  const fs = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fs) {
    try {
      const p = fs.call(el);
      if (p && p.then) p.then(() => {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
      }).catch(() => {});
    } catch (e) {}
  } else if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock("landscape").catch(() => {});
  }
}
function exitLandscape() {
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
}

addEventListener("orientationchange", () => setTimeout(resizeCv, 300));
document.addEventListener("fullscreenchange", () => setTimeout(resizeCv, 100));

/* =================================================================
   触控层 —— iOS Safari / Android Chrome 双端兼容
   pointer events 优先；不支持时退回 touch events；再退回 mouse
   ================================================================= */
const HAS_POINTER = !!window.PointerEvent;
const EV = HAS_POINTER
  ? { down: "pointerdown", move: "pointermove", up: "pointerup", cancel: "pointercancel" }
  : { down: "touchstart", move: "touchmove", up: "touchend", cancel: "touchcancel" };
// 统一取坐标(兼容 touch/mouse/pointer)
function evXY(e) {
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY, id: e.touches[0].identifier };
  if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY, id: e.changedTouches[0].identifier };
  return { x: e.clientX, y: e.clientY, id: e.pointerId !== undefined ? e.pointerId : 0 };
}
// 给元素绑定"按下即触发"的兼容事件
function onTap(el, fn) {
  let fired = false;
  el.addEventListener(EV.down, e => { e.preventDefault(); fired = true; fn(e); }, { passive: false });
  // 兜底: 某些旧安卓 WebView 不发 pointerdown
  if (!HAS_POINTER) el.addEventListener("mousedown", e => { if (!fired) { e.preventDefault(); fn(e); } });
}

/* ---------- 触控：摇杆(支持滑动跟随 + 多点) ---------- */
(function initJoy() {
  const joy = $("joy"), knob = $("knob");
  let jid = null, cx = 0, cy = 0;
  const R = 44;
  function setKnob(dx, dy) { knob.style.transform = `translate(${dx}px,${dy}px)`; }
  joy.addEventListener(EV.down, e => {
    e.preventDefault();
    const p = evXY(e); jid = p.id;
    if (HAS_POINTER && joy.setPointerCapture && e.pointerId !== undefined) { try { joy.setPointerCapture(e.pointerId); } catch (err) {} }
    const r = joy.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    handle(e);
  }, { passive: false });
  function handle(e) {
    const p = evXY(e);
    let dx = p.x - cx, dy = p.y - cy;
    const d = Math.hypot(dx, dy);
    if (d > R) { dx = dx / d * R; dy = dy / d * R; }
    setKnob(dx, dy);
    joyVec.x = dx / R; joyVec.y = dy / R;
  }
  joy.addEventListener(EV.move, e => {
    if (jid === null) return;
    e.preventDefault();
    handle(e);
  }, { passive: false });
  function up(e) { jid = null; setKnob(0, 0); joyVec.x = 0; joyVec.y = 0; }
  joy.addEventListener(EV.up, up);
  joy.addEventListener(EV.cancel, up);
})();

/* ---------- 按钮(双端兼容 + 多点触控) ---------- */

// 长按攻击键连击(手感更好)
(function autoAttack() {
  const btn = $("btnAtk");
  let hold = null;
  btn.addEventListener(EV.down, e => { e.preventDefault(); clearInterval(hold); hold = setInterval(doAttack, 260); }, { passive: false });
  const stop = () => { clearInterval(hold); hold = null; };
  btn.addEventListener(EV.up, stop); btn.addEventListener(EV.cancel, stop);
})();
// 键盘调试(电脑上也能玩)
addEventListener("keydown", e => {
  if (!B) return;
  if (e.key === "ArrowLeft" || e.key === "a") joyVec.x = -1;
  if (e.key === "ArrowRight" || e.key === "d") joyVec.x = 1;
  if (e.key === "ArrowUp" || e.key === "w") joyVec.y = -1;
  if (e.key === "ArrowDown" || e.key === "s") joyVec.y = 1;
  if (e.key === "j" || e.key === " ") doAttack();
  if (e.key === "k") doSkill();
  if (e.key === "l") doUlt();
});
addEventListener("keyup", e => {
  if (["ArrowLeft", "ArrowRight", "a", "d"].includes(e.key)) joyVec.x = 0;
  if (["ArrowUp", "ArrowDown", "w", "s"].includes(e.key)) joyVec.y = 0;
});

/* =================================================================
   平台兼容收尾 —— iOS / Android 常见坑处理
   ================================================================= */
// 1) 防止双击缩放(iOS Safari 会缩放，影响游戏操作)
let lastTouch = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if (now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });
// 2) 阻止双指缩放 & 手势缩放
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
// 3) iOS 音频解锁: 必须在用户手势中 resume AudioContext(以及静音开关陷阱)
(function unlockAudio() {
  const kick = () => {
    try { if (SND.on) { const ac = SND.ctx(); if (ac && ac.state === "suspended") ac.resume(); } } catch (e) {}
  };
  ["touchstart", "touchend", "pointerdown", "click", "keydown"].forEach(ev =>
    document.addEventListener(ev, kick, { passive: true, once: false }));
})();
// 4) 页面切到后台/回来: 停帧省电, 回来重算画布(安卓地址栏会改变视口)
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (B) B.paused = true; }
  else setTimeout(() => { resizeCv(); if (B && B.paused && !B.over) { /* 保持暂停，由玩家恢复 */ } }, 200);
});
window.addEventListener("pagehide", () => { if (B) B.paused = true; });
// 5) 安卓返回键/手势返回时阻止误退出
history.pushState({ game: 1 }, "");
window.addEventListener("popstate", () => {
  if (B && !B.over) { history.pushState({ game: 1 }, ""); B.paused = true; toast("已暂停"); }
});

/* ---------- 启动 ---------- */
refreshLobby();
</script>
